[package]
name = "recalign"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
clap = { version = "4.5", features = ["derive"] }
needletail = "0.6.1"
bit-vec = "0.8"
gfa = "0.8" # newer versions not working
handlegraph = "0.5"
bstr = "1.9.1"
rayon = "1.5"
ahash = "0.8.11"
peak_alloc = "0.2.0"
lt-fm-index = { version = "0.7.0-alpha.3", features = ["fastbwt"]}
bio = "2.0.3"
libc = "0.2.101"
bucket_queue = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
[target.'cfg(target_os="linux")'.dependencies]
tikv-jemallocator = "0.5"

[dev-dependencies]
criterion = "0.5.1"

[[bench]]
name = "recalign_benches"
harness = false

[profile.release]
lto = "fat"
codegen-units=1
panic="abort"

[profile.release-with-debug]
inherits = "release"
debug = true
lto = "off"
codegen-units=16
panic="unwind"
